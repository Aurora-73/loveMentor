name: self_disclosure
description: 自我暴露（她主动分享个人信息/感受/经历）
version: "0.1"
source: 规划定义

patterns:
  - type: regex
    value: "我(觉得|认为|感觉|想|喜欢|讨厌|害怕|担心|难过|开心|委屈|生气)"
    weight: 1.0

  - type: keyword
    value:
      - "我小时候"
      - "我以前"
      - "我家"
      - "我爸妈"
      - "我弟"
      - "我妹"
      - "我哥"
      - "我姐"
      - "我朋友"
      - "我同学"
      - "我同事"
      - "我老板"
      - "我学校"
      - "我公司"
      - "我住"
      - "我去过"
      - "我吃过"
      - "我看过"
      - "我听过"
      - "我玩过"
      - "我的梦想"
      - "我的秘密"
      - "跟你说"
      - "告诉你"
      - "你知道吗"
      - "我其实"
      - "我一直"
      - "我从来"
    weight: 0.8

  - type: keyword
    value:
      - "我好开心"
      - "我好难过"
      - "我好委屈"
      - "我好生气"
      - "我好害怕"
      - "我好担心"
      - "我睡不着"
      - "我想你了"
      - "我喜欢你"
      - "我挺怕"
      - "我不太敢"
    weight: 1.2

window_rule:
  her_hit_threshold: 2
