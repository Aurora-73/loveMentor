﻿name: information_exchange
description: 交换事实信息（她陈述了事实性信息）
version: "0.1"
source: 规划定义

patterns:
  - type: keyword
    value:
      - "我下周"
      - "我明天"
      - "我昨天"
      - "我在"
      - "我去"
      - "我来了"
      - "我到了"
      - "我吃过"
      - "我看过"
      - "我听过"
      - "我去过"
      - "我住在"
      - "我公司"
      - "我学校"
      - "我家"
      - "我爸妈"
      - "我弟弟"
      - "我妹妹"
      - "我朋友"
      - "我同学"
      - "我同事"
      - "天气"
      - "下雨"
      - "上班"
      - "下班"
      - "加班"
      - "开会"
      - "考试"
      - "作业"
      - "放假"
      - "周末"
      - "春节"
      - "国庆节"
      - "快递"
      - "外卖"
      - "买东西"
      - "吃饭"
      - "睡觉"
      - "起床"
    weight: 0.8

  - type: regex
    value: "[0-9]+号"
    weight: 0.9

  - type: regex
    value: "[0-9]+点"
    weight: 0.9

window_rule:
  her_hit_threshold: 2
