﻿name: opinion_expression
description: 表达观点/评价（她给出了主观判断）
version: "0.1"
source: 规划定义

patterns:
  - type: keyword
    value:
      - "我觉得"
      - "我认为"
      - "我感觉"
      - "我以为"
      - "我喜欢"
      - "我讨厌"
      - "我不喜欢"
      - "我觉得不错"
      - "我觉得挺好"
      - "我觉得一般"
      - "我觉得不好"
      - "还可以"
      - "挺不错"
      - "太棒了"
      - "太好了"
      - "好棒"
      - "厉害"
      - "牛"
      - "垃圾"
      - "太烂了"
      - "不好看"
      - "没意思"
      - "无聊"
      - "有意思"
      - "有趣"
      - "搞笑"
      - "好笑"
      - "可爱"
      - "漂亮"
      - "丑"
      - "帅"
      - "恶心"
      - "感动"
    weight: 1.0

  - type: regex
    value: ".*不怎么样.*"
    weight: 1.0

  - type: regex
    value: ".*一般般.*"
    weight: 0.8

window_rule:
  her_hit_threshold: 1
