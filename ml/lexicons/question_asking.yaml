name: question_asking
description: 主动提问（她向男方提出个人化问题）
version: "0.1"
source: 规划定义

patterns:
  - type: regex
    value: ".*[?？].*"
    weight: 1.0

  - type: keyword
    value:
      - "你觉得"
      - "你喜欢"
      - "你有没有"
      - "你在干嘛"
      - "你在哪"
      - "你去哪"
      - "你多大"
      - "你哪里人"
      - "你有女朋友"
      - "你有对象"
      - "你周末"
      - "你平时"
      - "你以前"
      - "你家"
      - "你弟弟"
      - "你妹妹"
      - "你爸妈"
      - "你在忙吗"
      - "你忙不忙"
      - "你有空吗"
      - "你觉得呢"
      - "你怎么看"
      - "你觉得怎么样"
      - "你在做什么"
    weight: 1.2

window_rule:
  her_hit_threshold: 1
