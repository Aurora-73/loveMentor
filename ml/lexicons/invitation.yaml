﻿name: invitation
description: 邀约/提议（她提出或积极回应见面/活动邀约）
version: "0.1"
source: 规划定义

patterns:
  - type: keyword
    value:
      - "出来玩"
      - "出来坐坐"
      - "出来走走"
      - "见一面"
      - "见面"
      - "约吗"
      - "要不要出来"
      - "周末要不要"
      - "有空吗"
      - "有空出来"
      - "一起吃饭"
      - "一起看电影"
      - "一起去"
      - "一起玩"
      - "下次一起"
      - "改天一起"
      - "去吃饭"
      - "去看电影"
      - "去玩"
      - "去逛"
      - "去唱歌"
      - "去喝酒"
      - "去爬山"
      - "去旅游"
      - "去散步"
      - "好呀"
      - "可以呀"
      - "没问题"
      - "当然"
      - "必须的"
      - "一定"
      - "求之不得"
      - "正有此意"
      - "我也想"
      - "我也觉得"
    weight: 1.0

window_rule:
  her_hit_threshold: 1
