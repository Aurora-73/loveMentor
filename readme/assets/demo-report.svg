<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Synthetic LoveMentor report</title><desc id="desc">A fictional local relationship-insight report with trends, observable signals and a cautious next action.</desc>
  <defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#0f172a"/><stop offset="1" stop-color="#1e1b4b"/></linearGradient></defs><rect width="1280" height="720" rx="28" fill="url(#g)"/>
  <g font-family="Segoe UI,Arial"><text x="56" y="76" fill="#f8fafc" font-size="36" font-weight="700">LoveMentor</text><text x="56" y="110" fill="#a5b4fc" font-size="18">Synthetic preview · no personal data · illustrative only</text><rect x="56" y="148" width="1168" height="2" fill="#334155"/>
  <text x="56" y="208" fill="#e2e8f0" font-size="22">Demo contact</text><text x="56" y="238" fill="#94a3b8" font-size="16">Last 30 days</text>
  <g><rect x="56" y="278" width="350" height="160" rx="18" fill="#172554"/><text x="84" y="320" fill="#a5b4fc" font-size="16">ACTIVITY TREND</text><path d="M88 402L140 378L196 389L248 330L302 346L376 300" fill="none" stroke="#67e8f9" stroke-width="7" stroke-linecap="round"/><text x="84" y="478" fill="#e2e8f0" font-size="17">Recent activity increased</text>
  <rect x="432" y="278" width="350" height="160" rx="18" fill="#172554"/><text x="460" y="320" fill="#a5b4fc" font-size="16">OBSERVABLE SIGNALS</text><text x="460" y="360" fill="#e2e8f0" font-size="18">• Reply rhythm: balanced</text><text x="460" y="396" fill="#e2e8f0" font-size="18">• Topic continuity: present</text>
  <rect x="808" y="278" width="416" height="160" rx="18" fill="#164e63"/><text x="836" y="320" fill="#a5f3fc" font-size="16">CAUTIOUS NEXT STEP</text><text x="836" y="360" fill="#ecfeff" font-size="18">Make one specific,</text><text x="836" y="390" fill="#ecfeff" font-size="18">easy-to-decline invitation.</text></g>
  <rect x="56" y="484" width="1168" height="170" rx="18" fill="#111827"/><text x="84" y="530" fill="#f8fafc" font-size="22" font-weight="700">Interpretation, not a verdict</text><text x="84" y="570" fill="#cbd5e1" font-size="19">Metrics identify patterns worth checking. They cannot establish another person's intent.</text><text x="84" y="610" fill="#cbd5e1" font-size="19">Use real-world context, respect boundaries, and treat a clear no as complete information.</text></g>
</svg>
